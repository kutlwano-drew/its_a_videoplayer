name: Its A Video Player Release

on:
  push:
    tags:
      - "v*.*.*-rc.*"
      - "v*.*.*"

permissions:
  contents: write

env:
  APP_NAME: "its_a_videoplayer"
  APP_VERSION: "1.0.0"

jobs:
  linux:
    name: Linux Release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libblkid-dev \
            liblzma-dev \
            libmpv-dev \
            libepoxy-dev \
            ruby-dev \
            build-essential \
            rpm \
            curl \
            file \
            desktop-file-utils

      - name: Install FPM
        run: |
          sudo gem install --no-document fpm

      - name: Install Snapcraft
        run: |
          sudo snap install snapcraft --classic

      - name: Get dependencies
        run: flutter pub get

      - name: Verify Flutter
        run: |
          flutter --version
          dart --version

      - name: Build Linux
        run: |
          flutter build linux \
            --release \
            --build-name "${{ env.APP_VERSION }}" \
            --build-number 1

      - name: Package Linux
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          chmod +x scripts/package_linux.sh
          ./scripts/package_linux.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/linux/*

  windows:
    name: Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify Flutter
        run: |
          flutter --version
          dart --version

      - name: Build Windows
        run: flutter build windows --release --build-name "${{ env.APP_VERSION }}" --build-number 1

      - name: Prepare Windows package directory
        shell: pwsh
        run: |
          $buildDir = "build\windows\x64\runner\Release"

          if (!(Test-Path $buildDir)) {
            throw "Windows build directory not found: $buildDir"
          }

          New-Item -ItemType Directory -Force -Path "dist\windows" | Out-Null

          $portableZip = "dist\windows\its_a_videoplayer-${{ github.ref_name }}-windows-x64-portable.zip"

          Compress-Archive `
            -Path "$buildDir\*" `
            -DestinationPath $portableZip `
            -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build EXE installer
        shell: pwsh
        run: |
          $buildDir = "$env:GITHUB_WORKSPACE\build\windows\x64\runner\Release"
          $outDir = "$env:GITHUB_WORKSPACE\dist\windows"
          $appVer = "$env:APP_VERSION"
          $relTag = "$env:GITHUB_REF_NAME"

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DBuildDir=$buildDir" `
            "/DOutDir=$outDir" `
            "/DAppVersion=$appVer" `
            "/DReleaseTag=$relTag" `
            "packaging\windows\its_a_videoplayer.iss"

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress

      - name: Build MSI
        shell: pwsh
        env:
          BUILD_DIR: ${{ github.workspace }}\build\windows\x64\runner\Release
          OUT_DIR: ${{ github.workspace }}\dist\windows
          APP_VERSION: ${{ env.APP_VERSION }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"

          $wixRoot = "${env:WIX}bin"

          if (!(Test-Path "$wixRoot\heat.exe")) {
            $wixRoot = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          }

          if (!(Test-Path "$wixRoot\heat.exe")) {
            throw "WiX Toolset was not found."
          }

          New-Item -ItemType Directory -Force -Path "build\wix" | Out-Null

          & "$wixRoot\heat.exe" dir "$env:BUILD_DIR" `
            -dr INSTALLFOLDER `
            -cg AppFiles `
            -ag `
            -sfrag `
            -srd `
            -var var.SourceDir `
            -out "build\wix\harvested.wxs"

          & "$wixRoot\candle.exe" `
            -arch x64 `
            -dSourceDir="$env:BUILD_DIR" `
            -dAppVersion="$env:APP_VERSION" `
            -out "build\wix\" `
            "packaging\windows\its_a_videoplayer.wxs" `
            "build\wix\harvested.wxs"

          & "$wixRoot\light.exe" `
            -out "$env:OUT_DIR\its_a_videoplayer-${env:RELEASE_TAG}-windows-x64.msi" `
            "build\wix\its_a_videoplayer.wixobj" `
            "build\wix\harvested.wixobj"

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          Get-ChildItem "dist\windows"

          if (!(Get-ChildItem "dist\windows\*.exe")) {
            throw "No Windows EXE installer was produced."
          }

          if (!(Get-ChildItem "dist\windows\*.msi")) {
            throw "No Windows MSI installer was produced."
          }

          if (!(Get-ChildItem "dist\windows\*.zip")) {
            throw "No Windows portable ZIP was produced."
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/windows/*

  macos-arm64:
    name: macOS arm64 Release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify Flutter
        run: |
          flutter --version
          dart --version

      - name: Build macOS
        run: |
          flutter build macos \
            --release \
            --build-name "${{ env.APP_VERSION }}" \
            --build-number 1

      - name: Package macOS
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -e

          APP_PATH="build/macos/Build/Products/Release/its_a_videoplayer.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Expected application was not found:"
            find build/macos -name "*.app" -print
            exit 1
          fi

          mkdir -p dist/macos

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "dist/macos/its_a_videoplayer-${RELEASE_TAG}-macos-arm64.zip"

          hdiutil create \
            -volname "Its A Video Player" \
            -srcfolder "$APP_PATH" \
            -ov \
            -format UDZO \
            "dist/macos/its_a_videoplayer-${RELEASE_TAG}-macos-arm64.dmg"

      - name: Upload macOS arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release
          path: dist/macos/*

  macos-x64:
    name: macOS x64 Release
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify Flutter
        run: |
          flutter --version
          dart --version

      - name: Build macOS
        run: |
          flutter build macos \
            --release \
            --build-name "${{ env.APP_VERSION }}" \
            --build-number 1

      - name: Package macOS
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -e

          APP_PATH="build/macos/Build/Products/Release/its_a_videoplayer.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Expected application was not found:"
            find build/macos -name "*.app" -print
            exit 1
          fi

          mkdir -p dist/macos

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "dist/macos/its_a_videoplayer-${RELEASE_TAG}-macos-x64.zip"

          hdiutil create \
            -volname "Its A Video Player" \
            -srcfolder "$APP_PATH" \
            -ov \
            -format UDZO \
            "dist/macos/its_a_videoplayer-${RELEASE_TAG}-macos-x64.dmg"

      - name: Upload macOS x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-release
          path: dist/macos/*

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    needs:
      - linux
      - windows
      - macos-arm64
      - macos-x64

    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: dist

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist

      - name: Download macOS arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-release
          path: dist

      - name: Download macOS x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-x64-release
          path: dist

      - name: Show release files
        run: |
          find dist -maxdepth 3 -type f -print

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Its A Video Player ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.snap
            dist/*.tar.gz
            dist/*.exe
            dist/*.msi
            dist/*.zip
            dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

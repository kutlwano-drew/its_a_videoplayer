name: "Its a Video Player Release"

on:
  push:
    tags:
      - "v*.*.*-rc.*"
      - "v*.*.*"

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.29.0"
  APP_NAME: "Its a Video Player"
  PACKAGE_NAME: "its-a-videoplayer"
  APP_VERSION: "1.0.0"

jobs:
  # ============================================================
  # LINUX
  # ============================================================

  linux:
    name: Linux Release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libblkid-dev \
            liblzma-dev \
            libmpv-dev \
            ruby-dev \
            build-essential \
            rpm \
            curl \
            wget \
            file \
            desktop-file-utils \
            libfuse2

      - name: Install FPM
        run: |
          sudo gem install --no-document fpm

      - name: Install Snapcraft
        run: |
          sudo snap install snapcraft --classic

      - name: Get dependencies
        run: flutter pub get

      - name: Verify Flutter
        run: |
          flutter --version
          dart --version

      - name: Resolve release version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%%-*}"

          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "Release version: $VERSION"

      - name: Build Linux
        run: |
          flutter build linux \
            --release \
            --build-name "${{ env.RELEASE_VERSION }}" \
            --build-number 1

      - name: Locate Linux executable
        shell: bash
        run: |
          set -e

          BUNDLE="build/linux/x64/release/bundle"

          if [ ! -d "$BUNDLE" ]; then
            echo "Linux bundle not found."
            exit 1
          fi

          echo "Linux bundle:"
          find "$BUNDLE" -maxdepth 2 -type f -print

          EXECUTABLE="$(find "$BUNDLE" -maxdepth 1 -type f -executable | head -n 1)"

          if [ -z "$EXECUTABLE" ]; then
            echo "Could not find Linux executable."
            exit 1
          fi

          EXECUTABLE_NAME="$(basename "$EXECUTABLE")"

          echo "LINUX_EXECUTABLE=$EXECUTABLE_NAME" >> "$GITHUB_ENV"

          echo "Executable: $EXECUTABLE_NAME"

      - name: Prepare Linux packaging files
        shell: bash
        run: |
          set -e

          mkdir -p dist/linux
          mkdir -p packaging/linux
          mkdir -p packaging/snap

          cat > packaging/linux/its-a-videoplayer.desktop <<EOF
          [Desktop Entry]
          Name=Its a Video Player
          Comment=A lightweight desktop-first video player built with Flutter
          Exec=its_a_videoplayer
          Icon=its-a-videoplayer
          Terminal=false
          Type=Application
          Categories=AudioVideo;Video;Player;
          MimeType=video/mp4;video/x-matroska;video/webm;video/quicktime;video/x-msvideo;audio/mpeg;audio/ogg;audio/wav;
          Keywords=video;player;media;movie;
          EOF

          if [ -f "assets/logo.png" ]; then
            cp assets/logo.png packaging/linux/its-a-videoplayer.png
          elif [ -f "assets/logo.jpg" ]; then
            echo "WARNING: assets/logo.jpg exists, but Linux desktop packaging expects PNG."
            echo "Convert it to assets/logo.png for proper Linux icon packaging."
          else
            echo "WARNING: No assets/logo.png found."
          fi

          desktop-file-validate \
            packaging/linux/its-a-videoplayer.desktop

      - name: Build Linux TAR.GZ
        shell: bash
        run: |
          set -e

          mkdir -p package-tar/${PACKAGE_NAME}

          cp -R \
            build/linux/x64/release/bundle/* \
            package-tar/${PACKAGE_NAME}/

          if [ -f packaging/linux/its-a-videoplayer.desktop ]; then
            mkdir -p package-tar/${PACKAGE_NAME}/share/applications
            cp packaging/linux/its-a-videoplayer.desktop \
              package-tar/${PACKAGE_NAME}/share/applications/
          fi

          if [ -f packaging/linux/its-a-videoplayer.png ]; then
            mkdir -p package-tar/${PACKAGE_NAME}/share/icons
            cp packaging/linux/its-a-videoplayer.png \
              package-tar/${PACKAGE_NAME}/share/icons/
          fi

          tar -czf \
            "dist/linux/${PACKAGE_NAME}-${GITHUB_REF_NAME}-linux-x64.tar.gz" \
            -C package-tar \
            "${PACKAGE_NAME}"

      - name: Build Debian package
        shell: bash
        run: |
          set -e

          mkdir -p package-deb/usr/lib/${PACKAGE_NAME}
          mkdir -p package-deb/usr/share/applications
          mkdir -p package-deb/usr/share/icons/hicolor/256x256/apps
          mkdir -p package-deb/usr/share/metainfo

          cp -R \
            build/linux/x64/release/bundle/* \
            package-deb/usr/lib/${PACKAGE_NAME}/

          cp packaging/linux/its-a-videoplayer.desktop \
            package-deb/usr/share/applications/

          if [ -f packaging/linux/its-a-videoplayer.png ]; then
            cp packaging/linux/its-a-videoplayer.png \
              package-deb/usr/share/icons/hicolor/256x256/apps/
          fi

          fpm \
            -s dir \
            -t deb \
            -n "${PACKAGE_NAME}" \
            -v "${RELEASE_VERSION}" \
            -a amd64 \
            --description "A lightweight desktop-first video player built with Flutter." \
            --maintainer "Its a Video Player" \
            --license "Proprietary" \
            --category "video" \
            --depends "libgtk-3-0" \
            --depends "libblkid1" \
            --depends "liblzma5" \
            --depends "libmpv1 | libmpv2" \
            -C package-deb \
            -p "dist/linux/${PACKAGE_NAME}-${GITHUB_REF_NAME}-linux-amd64.deb"

      - name: Build RPM package
        shell: bash
        run: |
          set -e

          mkdir -p package-rpm/usr/lib/${PACKAGE_NAME}
          mkdir -p package-rpm/usr/share/applications
          mkdir -p package-rpm/usr/share/icons/hicolor/256x256/apps

          cp -R \
            build/linux/x64/release/bundle/* \
            package-rpm/usr/lib/${PACKAGE_NAME}/

          cp packaging/linux/its-a-videoplayer.desktop \
            package-rpm/usr/share/applications/

          if [ -f packaging/linux/its-a-videoplayer.png ]; then
            cp packaging/linux/its-a-videoplayer.png \
              package-rpm/usr/share/icons/hicolor/256x256/apps/
          fi

          fpm \
            -s dir \
            -t rpm \
            -n "${PACKAGE_NAME}" \
            -v "${RELEASE_VERSION}" \
            -a x86_64 \
            --description "A lightweight desktop-first video player built with Flutter." \
            --maintainer "Its a Video Player" \
            --license "Proprietary" \
            --category "video" \
            --depends "mpv-libs" \
            -C package-rpm \
            -p "dist/linux/${PACKAGE_NAME}-${GITHUB_REF_NAME}-linux-x86_64.rpm"

      - name: Build AppImage
        shell: bash
        run: |
          set -e

          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp -R \
            build/linux/x64/release/bundle/* \
            AppDir/usr/bin/

          cp packaging/linux/its-a-videoplayer.desktop \
            AppDir/usr/share/applications/

          cp packaging/linux/its-a-videoplayer.desktop \
            AppDir/

          if [ -f packaging/linux/its-a-videoplayer.png ]; then
            cp packaging/linux/its-a-videoplayer.png \
              AppDir/usr/share/icons/hicolor/256x256/apps/

            cp packaging/linux/its-a-videoplayer.png \
              AppDir/its-a-videoplayer.png
          fi

          wget -q \
            "https://github.com/AppImage/appimagetool/releases/latest/download/appimagetool-x86_64.AppImage" \
            -O appimagetool

          chmod +x appimagetool

          ARCH=x86_64 \
            ./appimagetool \
            AppDir \
            "dist/linux/${PACKAGE_NAME}-${GITHUB_REF_NAME}-linux-x86_64.AppImage"

      - name: Prepare Snap
        shell: bash
        run: |
          set -e

          mkdir -p snap/gui
          mkdir -p snap/local

          cp -R \
            build/linux/x64/release/bundle \
            snap/local/bundle

          cp packaging/linux/its-a-videoplayer.desktop \
            snap/gui/its-a-videoplayer.desktop

          if [ -f packaging/linux/its-a-videoplayer.png ]; then
            cp packaging/linux/its-a-videoplayer.png \
              snap/gui/its-a-videoplayer.png
          fi

          cat > snap/snapcraft.yaml <<EOF
          name: its-a-videoplayer
          title: Its a Video Player
          version: '${RELEASE_VERSION}'
          summary: A lightweight desktop-first video player
          description: |
            A lightweight desktop-first video player built with Flutter.

          grade: stable
          confinement: strict
          base: core22

          apps:
            its-a-videoplayer:
              command: bundle/${LINUX_EXECUTABLE}
              extensions:
                - gnome
              plugs:
                - audio-playback
                - audio-record
                - home
                - removable-media
                - network
                - network-bind

          parts:
            its-a-videoplayer:
              plugin: dump
              source: snap/local/bundle
          EOF

      - name: Build Snap
        shell: bash
        run: |
          set -e

          cd snap

          snapcraft pack \
            --output "../dist/linux/${PACKAGE_NAME}-${GITHUB_REF_NAME}-linux-amd64.snap"

      - name: Verify Linux artifacts
        shell: bash
        run: |
          set -e

          echo "Linux release artifacts:"
          ls -lh dist/linux

          test -n "$(find dist/linux -name '*.deb' -print -quit)"
          test -n "$(find dist/linux -name '*.rpm' -print -quit)"
          test -n "$(find dist/linux -name '*.AppImage' -print -quit)"
          test -n "$(find dist/linux -name '*.snap' -print -quit)"
          test -n "$(find dist/linux -name '*.tar.gz' -print -quit)"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/linux/*

  # ============================================================
  # WINDOWS
  # ============================================================

  windows:
    name: Windows Release
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify Flutter
        run: |
          flutter --version
          dart --version

      - name: Resolve release version
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          $version = $version -replace '-.*$', ''

          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows
        run: |
          flutter build windows `
            --release `
            --build-name "${{ env.RELEASE_VERSION }}" `
            --build-number 1

      - name: Prepare Windows package directory
        shell: pwsh
        run: |
          $buildDir = "build\windows\x64\runner\Release"

          if (!(Test-Path $buildDir)) {
            throw "Windows build directory not found: $buildDir"
          }

          New-Item -ItemType Directory -Force -Path "dist\windows" | Out-Null

          Compress-Archive `
            -Path "$buildDir\*" `
            -DestinationPath "dist\windows\its-a-videoplayer-${env:GITHUB_REF_NAME}-windows-x64-portable.zip" `
            -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Create Inno Setup script
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "packaging\windows\output" | Out-Null

          @"
          #define MyAppName "Its a Video Player"
          #define MyAppVersion "${env:RELEASE_VERSION}"
          #define MyAppPublisher "Its a Video Player"
          #define MyAppExeName "its_a_videoplayer.exe"
          #define BuildDir "${env:GITHUB_WORKSPACE}\build\windows\x64\runner\Release"
          #define OutputDir "${env:GITHUB_WORKSPACE}\dist\windows"

          [Setup]
          AppId={{8D5D7E4A-7B7D-4C5C-A6AA-4D7D8D2F9C31}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={autopf}\Its a Video Player
          DefaultGroupName=Its a Video Player
          UninstallDisplayIcon={app}\{#MyAppExeName}
          OutputDir={#OutputDir}
          OutputBaseFilename=its-a-videoplayer-${env:GITHUB_REF_NAME}-windows-x64-setup
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern

          [Files]
          Source: "{#BuildDir}\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs ignoreversion

          [Icons]
          Name: "{group}\Its a Video Player"; Filename: "{app}\{#MyAppExeName}"
          Name: "{commondesktop}\Its a Video Player"; Filename: "{app}\{#MyAppExeName}"

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Launch Its a Video Player"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content "packaging\windows\ItsAVideoPlayer.iss"

      - name: Build EXE installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "packaging\windows\ItsAVideoPlayer.iss"

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress

      - name: Create WiX source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build\wix" | Out-Null

          @"
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Product
              Id="*"
              Name="Its a Video Player"
              Language="1033"
              Version="$(var.AppVersion)"
              Manufacturer="Its a Video Player"
              UpgradeCode="{4A5B4E35-2D8B-4F39-9B5C-3E5D6F6A1E42}">

              <Package
                InstallerVersion="500"
                Compressed="yes"
                InstallScope="perMachine"
                Platform="x64" />

              <MajorUpgrade
                DowngradeErrorMessage="A newer version of Its a Video Player is already installed." />

              <MediaTemplate EmbedCab="yes" />

              <Directory Id="TARGETDIR" Name="SourceDir">
                <Directory Id="ProgramFiles64Folder">
                  <Directory Id="INSTALLFOLDER" Name="Its a Video Player" />
                </Directory>
              </Directory>

              <Feature Id="MainFeature" Title="Its a Video Player" Level="1">
                <ComponentGroupRef Id="AppFiles" />
              </Feature>

            </Product>
          </Wix>
          "@ | Set-Content "packaging\windows\ItsAVideoPlayer.wxs"

      - name: Harvest Windows files
        shell: pwsh
        env:
          BUILD_DIR: ${{ github.workspace }}\build\windows\x64\runner\Release
        run: |
          $wixRoot = "${env:WIX}bin"

          if (!(Test-Path "$wixRoot\heat.exe")) {
            $wixRoot = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          }

          if (!(Test-Path "$wixRoot\heat.exe")) {
            $wixRoot = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          }

          if (!(Test-Path "$wixRoot\heat.exe")) {
            throw "WiX Toolset was not found."
          }

          & "$wixRoot\heat.exe" dir "$env:BUILD_DIR" `
            -dr INSTALLFOLDER `
            -cg AppFiles `
            -ag `
            -sfrag `
            -srd `
            -var var.SourceDir `
            -out "build\wix\harvested.wxs"

      - name: Build MSI
        shell: pwsh
        env:
          BUILD_DIR: ${{ github.workspace }}\build\windows\x64\runner\Release
          OUT_DIR: ${{ github.workspace }}\dist\windows
        run: |
          $ErrorActionPreference = "Stop"

          $wixRoot = "${env:WIX}bin"

          if (!(Test-Path "$wixRoot\heat.exe")) {
            $wixRoot = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          }

          if (!(Test-Path "$wixRoot\heat.exe")) {
            $wixRoot = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          }

          & "$wixRoot\candle.exe" `
            -arch x64 `
            -dSourceDir="$env:BUILD_DIR" `
            -dAppVersion="$env:RELEASE_VERSION" `
            -out "build\wix\" `
            "packaging\windows\ItsAVideoPlayer.wxs" `
            "build\wix\harvested.wxs"

          & "$wixRoot\light.exe" `
            -out "$env:OUT_DIR\its-a-videoplayer-${env:GITHUB_REF_NAME}-windows-x64.msi" `
            "build\wix\ItsAVideoPlayer.wixobj" `
            "build\wix\harvested.wixobj"

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          Get-ChildItem "dist\windows"

          if (!(Get-ChildItem "dist\windows\*.exe")) {
            throw "No Windows EXE installer was produced."
          }

          if (!(Get-ChildItem "dist\windows\*.msi")) {
            throw "No Windows MSI installer was produced."
          }

          if (!(Get-ChildItem "dist\windows\*.zip")) {
            throw "No Windows portable ZIP was produced."
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/windows/*

  # ============================================================
  # MACOS ARM64
  # ============================================================

  macos-arm64:
    name: macOS arm64 Release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify Flutter
        run: |
          flutter --version
          dart --version

      - name: Resolve release version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%%-*}"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build macOS
        run: |
          flutter build macos \
            --release \
            --build-name "${{ env.RELEASE_VERSION }}" \
            --build-number 1

      - name: Package macOS ARM64
        shell: bash
        run: |
          set -e

          APP_PATH="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "No macOS application found."
            exit 1
          fi

          mkdir -p dist/macos

          APP_BASENAME="$(basename "$APP_PATH" .app)"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            "dist/macos/its-a-videoplayer-${GITHUB_REF_NAME}-macos-arm64.zip"

          hdiutil create \
            -volname "$APP_BASENAME" \
            -srcfolder "$APP_PATH" \
            -ov \
            -format UDZO \
            "dist/macos/its-a-videoplayer-${GITHUB_REF_NAME}-macos-arm64.dmg"

      - name: Upload macOS ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release
          path: dist/macos/*

  # ============================================================
  # MACOS INTEL
  # ============================================================

  macos-x64:
    name: macOS x64 Release
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify Flutter
        run: |
          flutter --version
          dart --version

      - name: Resolve release version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%%-*}"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build macOS
        run: |
          flutter build macos \
            --release \
            --build-name "${{ env.RELEASE_VERSION }}" \
            --build-number 1

      - name: Package macOS x64
        shell: bash
        run: |
          set -e

          APP_PATH="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "No macOS application found."
            exit 1
          fi

          mkdir -p dist/macos

          APP_BASENAME="$(basename "$APP_PATH" .app)"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            "dist/macos/its-a-videoplayer-${GITHUB_REF_NAME}-macos-x64.zip"

          hdiutil create \
            -volname "$APP_BASENAME" \
            -srcfolder "$APP_PATH" \
            -ov \
            -format UDZO \
            "dist/macos/its-a-videoplayer-${GITHUB_REF_NAME}-macos-x64.dmg"

      - name: Upload macOS x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-release
          path: dist/macos/*

  # ============================================================
  # GITHUB RELEASE
  # ============================================================

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    needs:
      - linux
      - windows
      - macos-arm64
      - macos-x64

    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: dist

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist

      - name: Download macOS ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-release
          path: dist

      - name: Download macOS x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-x64-release
          path: dist

      - name: Show release files
        run: |
          echo "========== RELEASE FILES =========="
          find dist -type f -maxdepth 3 -print
          echo "==================================="

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Its a Video Player ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.snap
            dist/*.tar.gz
            dist/*.exe
            dist/*.msi
            dist/*.zip
            dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
